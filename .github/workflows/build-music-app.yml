name: Symphonia Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'         
  workflow_dispatch:   # optional: run manually too

jobs:
  build:
    name: Build ${{ matrix.rid }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    env:
      Solution_Name: Symphonia.sln
      Project_Path: Symphonia.csproj
      Configuration: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore "${{ env.Solution_Name }}" --runtime ${{ matrix.rid }}

      - name: Build
        run: dotnet build "${{ env.Solution_Name }}" -c "${{ env.Configuration }}" --no-restore

      - name: Publish single-file app
        run: >
          dotnet publish "${{ env.Project_Path }}"
          -c "${{ env.Configuration }}"
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishDir=publish/Release/${{ matrix.rid }}

      - name: Get tag or commit message
        shell: bash
        run: |
          git fetch --tags --force
          TAG_MSG="$(git for-each-ref refs/tags/${{ github.ref_name }} --format="%(contents)")"
          if [ -z "$TAG_MSG" ]; then
            TAG_MSG="$(git log -1 --pretty=%B)"
          fi
          {
            echo "TAG_MSG<<EOF"
            echo "$TAG_MSG"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Upload publish folder
        uses: actions/upload-artifact@v4
        with:
          name: symphonia-${{ matrix.rid }}
          path: publish/Release/${{ matrix.rid }}/
