name: Symphonia Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'         
  workflow_dispatch:   # optional: run manually too

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            mac_restore_only: true
    env:
      Solution_Name: Symphonia.sln
      Project_Path: Symphonia.csproj
      Configuration: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Use full Visual Studio MSBuild on Windows so COMReference works
      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      # Restore on Windows targeting the chosen RID
      - name: Restore (Windows)
        if: runner.os == 'Windows'
        run: dotnet restore $env:Solution_Name --runtime ${{ matrix.rid }}

      # On macOS, only validate restore with Windows targeting enabled. Build is Windows-only (WPF).
      - name: Restore (macOS)
        if: runner.os == 'macOS'
        run: dotnet restore "${{ env.Solution_Name }}" -p:EnableWindowsTargeting=true

      # Build with Visual Studio MSBuild on Windows (required for ResolveComReference)
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration

      # Publish single-file, self-contained app on Windows
      - name: Publish (Windows)
        if: runner.os == 'Windows'
        run: >
          msbuild $env:Project_Path /t:Publish
          /p:Configuration=$env:Configuration
          /p:RuntimeIdentifier=${{ matrix.rid }}
          /p:SelfContained=true
          /p:PublishSingleFile=true
          /p:IncludeAllContentForSelfExtract=true
          /p:EnableCompressionInSingleFile=true
          /p:PublishDir=publish\Release\${{ matrix.rid }}

      - name: Upload publish folder (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: symphonia-${{ matrix.rid }}
          path: publish/Release/${{ matrix.rid }}/
